<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="monospace">
  <rect width="720" height="440" fill="#fffaeb"/>
  <pattern id="dots2" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f1f1f" opacity="0.10"/></pattern>
  <rect width="720" height="440" fill="url(#dots2)"/>
  <rect x="0" y="0" width="720" height="44" fill="#fffaeb" opacity="0.5" stroke="#14b8a6"/>
  <text x="16" y="28" font-size="12" fill="#1f1f1f">■ fabio.sh   PROJECTS ABOUT CONTACT</text>
  <g id="fw2"></g>
  <script><![CDATA[
    const F={F:["11111","10000","10000","11110","10000","10000","10000"],A:["01110","10001","10001","11111","10001","10001","10001"],B:["11110","10001","10001","11110","10001","10001","11110"],I:["11111","00100","00100","00100","00100","00100","11111"],O:["01110","10001","10001","10001","10001","10001","01110"]};
    const R=["#ccfbf1","#99f6e4","#5eead4","#2dd4bf","#14b8a6","#0f766e"];const t=12;let x=40;
    for(const ch of "FABIO"){const g=F[ch];for(let r=0;r<7;r++)for(let c=0;c<5;c++){if(g[r][c]==="1"){const d=document.createElementNS("http://www.w3.org/2000/svg","rect");d.setAttribute("x",x+c*t);d.setAttribute("y",70+r*t);d.setAttribute("width",t);d.setAttribute("height",t);d.setAttribute("fill",R[(r+c)%6]);document.getElementById("fw2").appendChild(d);}}x+=6*t;}
  ]]></script>
  <rect x="40" y="62" width="380" height="96" fill="none" stroke="#1f1f1f" stroke-width="2"/>
  <g>
    <rect x="40" y="200" width="300" height="140" fill="#fffaeb" opacity="0.5" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="56" y="230" font-size="15" fill="#1f1f1f" font-weight="bold">Deep frosted card</text>
    <text x="56" y="255" font-size="11" fill="#666">20px blur, 52% paper — the dot grid</text>
    <text x="56" y="271" font-size="11" fill="#666">glows through softly, turquoise hairline.</text>
    <rect x="352" y="208" width="300" height="140" fill="#0d9488" opacity="0.9"/>
    <rect x="352" y="200" width="300" height="140" fill="none" stroke="#14b8a6" stroke-width="2"/>
  </g>
  <rect x="40" y="372" width="120" height="34" fill="#14b8a6"/><text x="56" y="393" font-size="11" fill="#fff">PROJECTS</text>
  <rect x="172" y="372" width="120" height="34" fill="none" stroke="#14b8a6" stroke-width="1.5"/><text x="192" y="393" font-size="11" fill="#14b8a6">CONTACT</text>
  <text x="40" y="430" font-size="10" fill="#666">OPTION B — heavy frost (blur 20px), turquoise borders, smaller mosaic</text>
</svg>
