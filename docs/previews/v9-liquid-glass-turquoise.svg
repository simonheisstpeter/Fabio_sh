<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="monospace">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#1f1f1f" opacity="0.07"/></pattern>
    <radialGradient id="glow1" cx="0.85" cy="0" r="0.7"><stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0" cy="0.3" r="0.8"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ccfbf1" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="solbtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="760" height="470" fill="#fffaeb"/>
  <rect width="760" height="470" fill="url(#dots)"/>
  <rect width="760" height="470" fill="url(#glow1)"/>
  <rect width="760" height="470" fill="url(#glow2)"/>
  <rect x="0" y="0" width="760" height="46" fill="url(#liq)" stroke="#ffffff" stroke-opacity="0.65"/>
  <rect x="0" y="0" width="760" height="46" fill="url(#sheen)"/>
  <text x="16" y="29" font-size="12" fill="#1f1f1f">■ fabio.sh&#160;&#160; PROJECTS&#160;&#160; ABOUT&#160;&#160; CONTACT</text>
  <g id="fw"></g>
  <script><![CDATA[
    const F={F:["11111","10000","10000","11110","10000","10000","10000"],A:["01110","10001","10001","11111","10001","10001","10001"],B:["11110","10001","10001","11110","10001","10001","11110"],I:["11111","00100","00100","00100","00100","00100","11111"],O:["01110","10001","10001","10001","10001","10001","01110"]};
    const R=["#ccfbf1","#99f6e4","#5eead4","#2dd4bf","#0d9488","#0f766e"];const t=15;let x=48;
    for(const ch of "FABIO"){const g=F[ch];for(let r=0;r<7;r++)for(let c=0;c<5;c++){if(g[r][c]==="1"){const d=document.createElementNS("http://www.w3.org/2000/svg","rect");d.setAttribute("x",x+c*t);d.setAttribute("y",78+r*t);d.setAttribute("width",t-1);d.setAttribute("height",t-1);d.setAttribute("fill",R[(r+c)%6]);document.getElementById("fw").appendChild(d);}}x+=6*t;}
    const caret=document.createElementNS("http://www.w3.org/2000/svg","rect");caret.setAttribute("x",x+5);caret.setAttribute("y",78+6*t-1);caret.setAttribute("width",t-1);caret.setAttribute("height",t-1);caret.setAttribute("fill","#14b8a6");document.getElementById("fw").appendChild(caret);
  ]]></script>
  <rect x="40" y="68" width="500" height="128" fill="url(#liq)" stroke="#ffffff" stroke-opacity="0.7"/>
  <rect x="40" y="68" width="500" height="128" fill="url(#sheen)"/>
  <rect x="48" y="76" width="484" height="8" fill="#ffffff" opacity="0.8"/>
  <rect x="40" y="68" width="500" height="128" fill="none" stroke="#0f766e" stroke-opacity="0.55"/>
  <g>
    <rect x="40" y="226" width="110" height="14" fill="#99f6e4"/><rect x="150" y="226" width="110" height="14" fill="#5eead4"/><rect x="260" y="226" width="110" height="14" fill="#2dd4bf"/><rect x="370" y="226" width="110" height="14" fill="#14b8a6"/><rect x="480" y="226" width="110" height="14" fill="#0d9488"/><rect x="590" y="226" width="110" height="14" fill="#0f766e"/>
  </g>
  <g>
    <rect x="48" y="258" width="316" height="132" fill="#0f766e" opacity="0.5"/>
    <rect x="40" y="250" width="316" height="132" fill="url(#liq)" stroke="#ffffff" stroke-opacity="0.65"/>
    <rect x="40" y="250" width="316" height="132" fill="url(#sheen)"/>
    <rect x="48" y="258" width="300" height="7" fill="#ffffff" opacity="0.75"/>
    <text x="56" y="290" font-size="15" fill="#1f1f1f" font-weight="bold">Liquid card</text>
    <text x="56" y="314" font-size="11" fill="#444">blur 16px + saturate 1.6, specular top</text>
    <text x="56" y="330" font-size="11" fill="#444">edge, turquoise rim + hard shadow.</text>
  </g>
  <g>
    <rect x="388" y="266" width="316" height="132" fill="#0f766e" opacity="0.5"/>
    <rect x="380" y="258" width="316" height="132" fill="url(#liq)" stroke="#ffffff" stroke-opacity="0.65"/>
    <rect x="380" y="258" width="316" height="132" fill="url(#sheen)"/>
    <text x="396" y="298" font-size="15" fill="#1f1f1f" font-weight="bold">Mosaic in glass</text>
    <text x="396" y="322" font-size="11" fill="#444">turquoise ramp tiles over frosted</text>
    <text x="396" y="338" font-size="11" fill="#444">paper + ambient glows.</text>
  </g>
  <rect x="40" y="416" width="128" height="34" fill="url(#solbtn)" stroke="#ffffff" stroke-opacity="0.5"/>
  <rect x="44" y="419" width="120" height="6" fill="#ffffff" opacity="0.5"/>
  <text x="58" y="437" font-size="11" fill="#ffffff">PROJECTS</text>
