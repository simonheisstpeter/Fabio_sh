<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="monospace">
  <rect width="720" height="440" fill="#fffaeb"/>
  <pattern id="dots3" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f1f1f" opacity="0.08"/></pattern>
  <rect width="720" height="440" fill="url(#dots3)"/>
  <rect x="0" y="0" width="720" height="44" fill="#fffaeb" opacity="0.62" stroke="#0d9488"/>
  <text x="16" y="28" font-size="12" fill="#1f1f1f">■ fabio.sh</text>
  <g id="fw3"></g>
  <script><![CDATA[
    const F={F:["11111","10000","10000","11110","10000","10000","10000"],A:["01110","10001","10001","11111","10001","10001","10001"],B:["11110","10001","10001","11110","10001","10001","11110"],I:["11111","00100","00100","00100","00100","00100","11111"],O:["01110","10001","10001","10001","10001","10001","01110"]};
    const R=["#99f6e4","#5eead4","#2dd4bf","#14b8a6","#0d9488","#0f766e"];const t=17;let x=40;
    for(const ch of "FABIO"){const g=F[ch];for(let r=0;r<7;r++)for(let c=0;c<5;c++){if(g[r][c]==="1"){const d=document.createElementNS("http://www.w3.org/2000/svg","rect");d.setAttribute("x",x+c*t);d.setAttribute("y",64+r*t);d.setAttribute("width",t);d.setAttribute("height",t);d.setAttribute("fill",R[(r+c)%6]);document.getElementById("fw3").appendChild(d);}}x+=6*t;}
  ]]></script>
  <rect x="40" y="56" width="530" height="128" fill="none" stroke="#1f1f1f" stroke-width="2.5"/>
  <!-- tiled divider -->
  <g id="div"></g>
  <script><![CDATA[
    const R2=["#99f6e4","#5eead4","#2dd4bf","#14b8a6","#0d9488","#0f766e"];
    for(let i=0;i<45;i++){const d=document.createElementNS("http://www.w3.org/2000/svg","rect");d.setAttribute("x",40+i*15);d.setAttribute("y",212);d.setAttribute("width",15);d.setAttribute("height",15);d.setAttribute("fill",R2[i%6]);document.getElementById("div").appendChild(d);}
  ]]></script>
  <rect x="40" y="250" width="300" height="120" fill="#fffaeb" stroke="#1f1f1f" stroke-width="2"/>
  <rect x="47" y="257" width="300" height="120" fill="#0f766e"/>
  <text x="56" y="285" font-size="15" fill="#1f1f1f" font-weight="bold">Poster card (opaque)</text>
  <text x="56" y="308" font-size="11" fill="#666">Mosaic does the talking; tiled divider.</text>
  <rect x="368" y="250" width="300" height="120" fill="#fffaeb" opacity="0.6" stroke="#0d9488"/>
  <text x="384" y="285" font-size="15" fill="#1f1f1f" font-weight="bold">Glass chrome</text>
  <text x="384" y="308" font-size="11" fill="#666">Glass only on nav / CTA surfaces.</text>
  <rect x="40" y="396" width="120" height="30" fill="#0d9488"/><text x="56" y="415" font-size="10" fill="#fff">PROJECTS</text>
  <text x="40" y="438" font-size="10" fill="#666">OPTION C — giant 34px tiles, tiled dividers, opaque cards + glass chrome only</text>
</svg>
